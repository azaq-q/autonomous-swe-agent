# End-to-end demo deployment. The worker uses LocalSandbox inside its own container;
# use a dedicated sandbox service or microVM isolation before production use.
x-agent-environment: &agent-environment
  DATABASE_URL: postgresql+psycopg://swe:swe@postgres:5432/swe_agent
  REDIS_URL: redis://redis:6379/0
  TASK_BACKEND: celery
  SANDBOX_PROVIDER: local
  WORKDIR: /data/workspace
  ARTIFACT_DIR: /data/artifacts
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-4o}
  MODEL_INPUT_COST_PER_MILLION: ${MODEL_INPUT_COST_PER_MILLION:-0}
  MODEL_OUTPUT_COST_PER_MILLION: ${MODEL_OUTPUT_COST_PER_MILLION:-0}
  TASK_MAX_INPUT_TOKENS: ${TASK_MAX_INPUT_TOKENS:-8000000}
  TASK_MAX_OUTPUT_TOKENS: ${TASK_MAX_OUTPUT_TOKENS:-250000}
  TASK_MAX_LLM_CALLS: ${TASK_MAX_LLM_CALLS:-128}
  TASK_MAX_COST_USD: ${TASK_MAX_COST_USD:-2.0}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
  EMBEDDING_CACHE_DIR: /data/embedding-cache
  EMBEDDING_MODEL_PATH: ${EMBEDDING_MODEL_PATH:-}
  RAG_VECTOR_STORE: ${RAG_VECTOR_STORE:-memory}
  RAG_VECTOR_THRESHOLD: ${RAG_VECTOR_THRESHOLD:-0.1}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}

services:
  api:
    build:
      context: ./backend
    environment: *agent-environment
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - agent_workspace:/data/workspace
      - agent_artifacts:/data/artifacts
      - embedding_cache:/data/embedding-cache

  worker:
    build:
      context: ./backend
    environment: *agent-environment
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "worker", "--loglevel=info"]
    depends_on:
      api:
        condition: service_started
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - agent_workspace:/data/workspace
      - agent_artifacts:/data/artifacts
      - embedding_cache:/data/embedding-cache

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  agent_workspace:
  agent_artifacts:
  embedding_cache:
